<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img"
     aria-label="Client and server. On your machine, interactive Claude Code sessions reach the hustle host's external MCP endpoint through a TLS proxy with the interactive token, and the browser reaches the dashboard. On the hustle host, the hustlebot sessions use the internal MCP endpoint on localhost, each with its own token.">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .t{font-size:16px;font-weight:600;fill:#e6e6e6}
  .m{font-size:13px;fill:#8a94a6}
  .c{font-size:13px;fill:#c8d0dc;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .h{font-size:11px;font-weight:700;fill:#8a94a6;letter-spacing:.12em}
  .e{stroke:#4b5a74;stroke-width:1.6;fill:none;marker-end:url(#a)}
  @keyframes dash{to{stroke-dashoffset:-20}}
  .flow{stroke-dasharray:6 4;animation:dash 1s linear infinite}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5a74"/></marker></defs>
<rect width="900" height="330" rx="16" fill="#0f1115"/>
<rect x=".5" y=".5" width="899" height="329" rx="16" fill="none" stroke="#232833"/>

<!-- client -->
<text x="32" y="42" class="h">CLIENT · YOUR MACHINE</text>
<rect x="32" y="56" width="220" height="214" rx="12" fill="none" stroke="#2a3242" stroke-dasharray="4 4"/>
<rect x="48" y="74" width="188" height="72" rx="10" fill="#171a21" stroke="#2a3242"/>
<text x="64" y="100" class="t">Claude Code</text><text x="64" y="120" class="m">external session</text><text x="64" y="137" class="c">/hustle</text>
<rect x="48" y="176" width="188" height="72" rx="10" fill="#171a21" stroke="#2a3242"/>
<text x="64" y="202" class="t">Browser</text><text x="64" y="222" class="m">control · graph ·</text><text x="64" y="239" class="m">cinema view</text>

<!-- proxy -->
<rect x="300" y="64" width="34" height="196" rx="8" fill="#1c2230" stroke="#2a3242"/>
<text transform="translate(322 162) rotate(-90)" text-anchor="middle" class="h">TLS PROXY</text>

<!-- server -->
<text x="380" y="42" class="h">SERVER · HUSTLE HOST</text>
<rect x="380" y="56" width="490" height="214" rx="12" fill="#10263a" fill-opacity=".5" stroke="#5ab0f0" stroke-opacity=".5"/>
<rect x="396" y="74" width="200" height="60" rx="10" fill="#171a21" stroke="#2a3242"/>
<text x="412" y="99" class="t">external MCP</text><text x="412" y="119" class="m">interactive token only</text>
<rect x="396" y="176" width="200" height="60" rx="10" fill="#171a21" stroke="#2a3242"/>
<text x="412" y="201" class="t">dashboard</text><text x="412" y="221" class="m">dashboard token</text>
<rect x="640" y="74" width="214" height="162" rx="10" fill="#171a21" stroke="#5ab0f0" stroke-opacity=".7"/>
<text x="656" y="99" class="t">hustlemaster</text>
<text x="656" y="126" class="m">internal MCP · 127.0.0.1</text>
<text x="656" y="143" class="m">one token per session</text>
<g>
  <rect x="656" y="160" width="86" height="28" rx="6" fill="#d8a548" fill-opacity=".18" stroke="#d8a548" stroke-opacity=".6"/><text x="699" y="179" text-anchor="middle" class="m" style="fill:#e6e6e6">worker</text>
  <rect x="752" y="160" width="86" height="28" rx="6" fill="#d8a548" fill-opacity=".18" stroke="#d8a548" stroke-opacity=".6"/><text x="795" y="179" text-anchor="middle" class="m" style="fill:#e6e6e6">worker</text>
  <rect x="656" y="196" width="182" height="28" rx="6" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".6"/><text x="747" y="215" text-anchor="middle" class="m" style="fill:#e6e6e6">overseer · internal sessions</text>
</g>

<path class="e flow" d="M236 110 L298 110"/><path class="e flow" d="M334 104 L394 104"/>
<path class="e flow" d="M236 212 L298 212"/><path class="e flow" d="M334 206 L394 206"/>
<path class="e" d="M596 104 L638 104"/><path class="e" d="M596 206 L638 206"/>

<text x="32" y="302" class="m">Plan from anywhere; hustlebots never leave the host. Each caller gets only its rights: read · propose · change plan · submit.</text>
</svg>
