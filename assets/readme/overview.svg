<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="hustlebot in one picture: you plan goals with /hustle into dependency graphs; the hustlemaster shares the session budget between the hustles by weight; hustlebots work in parallel, several increments within one hustle and several hustles side by side, each in its own worktree; verified results are fast-forwarded into each project's main.">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .t{font-size:15px;font-weight:600;fill:#e6e6e6}
  .m{font-size:13px;fill:#8a94a6}
  .g{font-size:13px;font-weight:600}
  .c{font-size:15px;fill:#e6e6e6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .h{font-size:12px;font-weight:700;fill:#8a94a6;letter-spacing:.12em}
  .n{font-size:13px;font-weight:700;fill:#5ab0f0}
  .e{stroke:#4b5a74;stroke-width:1.6;fill:none}
  .arrow{stroke-opacity:.75;stroke-width:2;fill:none;stroke-dasharray:7 5;animation:dash 1s linear infinite}
  .A{stroke:#5ab0f0;marker-end:url(#aA)} .B{stroke:#5ee0b0;marker-end:url(#aB)}
  @keyframes dash{to{stroke-dashoffset:-24}}
  @keyframes fill{0%{transform:scaleX(.04)}80%,100%{transform:scaleX(1)}}
  .bar{transform-box:fill-box;transform-origin:left;animation:fill 5s ease-in-out infinite}
  .b2{animation-delay:-1.7s}.b3{animation-delay:-3.3s}.b4{animation-delay:-.8s}
  @keyframes pop{0%,15%{opacity:0;transform:scale(.3)}25%,100%{opacity:1;transform:scale(1)}}
  .commit{transform-box:fill-box;transform-origin:center;animation:pop 5s ease-out infinite}
  .k2{animation-delay:1.2s}.k3{animation-delay:2.4s}.k4{animation-delay:3.6s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring{transform-origin:470px 215px;animation:spin 16s linear infinite}
</style>
<defs>
  <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5ab0f0"/></marker>
  <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5ee0b0"/></marker>
  <radialGradient id="core"><stop offset="0" stop-color="#9fd2ff"/><stop offset=".45" stop-color="#3a6df0"/><stop offset="1" stop-color="#1a2a6c" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="400" rx="18" fill="#0f1115"/>
<rect x=".5" y=".5" width="1199" height="399" rx="18" fill="none" stroke="#232833"/>

<!-- 1 plan: two hustles -->
<text x="36" y="46" class="n">1</text><text x="52" y="46" class="h">PLAN</text>
<rect x="36" y="62" width="270" height="40" rx="8" fill="#171a21" stroke="#2a3242"/>
<text x="52" y="88" class="c"><tspan fill="#5ee08a">›</tspan> /hustle <tspan fill="#8a94a6">one per goal</tspan></text>

<circle cx="42" cy="134" r="5" fill="#5ab0f0"/><text x="54" y="139" class="g" fill="#5ab0f0">Checkout v2</text>
<g>
  <path class="e" d="M70 180 C90 180 100 156 122 156"/><path class="e" d="M70 180 C90 180 100 204 122 204"/>
  <path class="e" d="M144 156 C166 156 172 180 194 180"/><path class="e" d="M144 204 C166 204 172 180 194 180"/>
  <path class="e" d="M216 180 L256 180"/>
  <circle cx="60" cy="180" r="10" fill="#4cc9d8"/><circle cx="133" cy="156" r="10" fill="#d8a548"/><circle cx="133" cy="204" r="10" fill="#a78bfa"/>
  <circle cx="205" cy="180" r="10" fill="#d8a548"/>
  <rect x="258" y="170" width="20" height="20" rx="3" transform="rotate(45 268 180)" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
</g>

<circle cx="42" cy="252" r="5" fill="#5ee0b0"/><text x="54" y="257" class="g" fill="#5ee0b0">Docs search</text>
<g>
  <path class="e" d="M144 280 C166 280 172 300 194 300"/><path class="e" d="M144 320 C166 320 172 300 194 300"/>
  <path class="e" d="M216 300 L256 300"/>
  <circle cx="133" cy="280" r="10" fill="#4cc9d8"/><circle cx="133" cy="320" r="10" fill="#4cc9d8"/>
  <circle cx="205" cy="300" r="10" fill="#d8a548"/>
  <rect x="258" y="290" width="20" height="20" rx="3" transform="rotate(45 268 300)" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
</g>
<text x="36" y="370" class="m">dependency graphs · a model per increment</text>

<path class="arrow A" d="M300 180 C340 180 350 200 384 206"/>
<path class="arrow B" d="M300 300 C340 300 350 232 384 226"/>

<!-- 2 budget -->
<text x="400" y="46" class="n">2</text><text x="416" y="46" class="h">SHARE THE BUDGET</text>
<circle cx="470" cy="215" r="62" fill="url(#core)" opacity=".85"/>
<circle cx="470" cy="215" r="76" fill="none" stroke="#232833" stroke-width="6"/>
<g class="ring">
  <path d="M470 139 A76 76 0 1 1 407.7 258.6" fill="none" stroke="#5ab0f0" stroke-width="6" stroke-linecap="round"/>
  <path d="M402.9 250.7 A76 76 0 0 1 464.7 139.2" fill="none" stroke="#5ee0b0" stroke-width="6" stroke-linecap="round"/>
</g>
<text x="470" y="217" text-anchor="middle" style="font-size:30px;font-weight:700;fill:#fff">20</text>
<text x="470" y="237" text-anchor="middle" style="font-size:11px;font-weight:700;letter-spacing:.14em;fill:#dbe8ff">POINTS</text>
<text x="556" y="168" class="g" fill="#5ab0f0">2 fr</text>
<text x="370" y="300" class="g" fill="#5ee0b0">1 fr</text>
<text x="400" y="352" class="m">hustlemaster shares the</text>
<text x="400" y="370" class="m">session budget by weight</text>

<path class="arrow A" d="M556 190 C585 160 600 140 628 140"/>
<path class="arrow B" d="M556 245 C585 275 600 296 628 296"/>

<!-- 3 work in parallel -->
<text x="644" y="46" class="n">3</text><text x="660" y="46" class="h">WORK IN PARALLEL</text>
<rect x="636" y="62" width="320" height="168" rx="12" fill="#5ab0f0" fill-opacity=".05" stroke="#5ab0f0" stroke-opacity=".55" stroke-dasharray="5 4"/>
<text x="652" y="84" class="g" fill="#5ab0f0">Checkout v2</text><text x="940" y="84" text-anchor="end" class="m">2 at once</text>
<g>
  <rect x="652" y="96" width="288" height="56" rx="10" fill="#171a21" stroke="#2a3242"/><rect x="652" y="96" width="5" height="56" rx="2" fill="#d8a548"/>
  <text x="670" y="119" class="t">hustlebot · cart</text><text x="926" y="119" text-anchor="end" class="m">sonnet</text>
  <rect x="670" y="132" width="256" height="6" rx="3" fill="#232833"/><rect class="bar" x="670" y="132" width="256" height="6" rx="3" fill="#5ab0f0"/>
</g>
<g>
  <rect x="652" y="162" width="288" height="56" rx="10" fill="#171a21" stroke="#2a3242"/><rect x="652" y="162" width="5" height="56" rx="2" fill="#a78bfa"/>
  <text x="670" y="185" class="t">hustlebot · payment</text><text x="926" y="185" text-anchor="end" class="m">opus</text>
  <rect x="670" y="198" width="256" height="6" rx="3" fill="#232833"/><rect class="bar b2" x="670" y="198" width="256" height="6" rx="3" fill="#5ab0f0"/>
</g>

<rect x="636" y="246" width="320" height="104" rx="12" fill="#5ee0b0" fill-opacity=".05" stroke="#5ee0b0" stroke-opacity=".55" stroke-dasharray="5 4"/>
<text x="652" y="268" class="g" fill="#5ee0b0">Docs search</text><text x="940" y="268" text-anchor="end" class="m">2 at once</text>
<g>
  <rect x="652" y="280" width="140" height="56" rx="10" fill="#171a21" stroke="#2a3242"/><rect x="652" y="280" width="5" height="56" rx="2" fill="#4cc9d8"/>
  <text x="668" y="303" class="t">guide</text><text x="780" y="303" text-anchor="end" class="m">haiku</text>
  <rect x="668" y="316" width="112" height="6" rx="3" fill="#232833"/><rect class="bar b3" x="668" y="316" width="112" height="6" rx="3" fill="#5ee0b0"/>
</g>
<g>
  <rect x="800" y="280" width="140" height="56" rx="10" fill="#171a21" stroke="#2a3242"/><rect x="800" y="280" width="5" height="56" rx="2" fill="#4cc9d8"/>
  <text x="816" y="303" class="t">reference</text><text x="928" y="303" text-anchor="end" class="m">haiku</text>
  <rect x="816" y="316" width="112" height="6" rx="3" fill="#232833"/><rect class="bar b4" x="816" y="316" width="112" height="6" rx="3" fill="#5ee0b0"/>
</g>
<text x="644" y="378" class="m">within a hustle and across hustles</text>

<path class="arrow A" d="M962 146 L1008 146"/>
<path class="arrow B" d="M962 298 L1008 298"/>

<!-- 4 merge: one main per project -->
<text x="1020" y="46" class="n">4</text><text x="1036" y="46" class="h">MERGE</text>
<text x="1020" y="126" class="m">shop-api · <tspan class="t" style="font-size:13px">main</tspan></text>
<line x1="1020" y1="146" x2="1170" y2="146" stroke="#5ab0f0" stroke-width="3" stroke-linecap="round"/>
<circle class="commit" cx="1036" cy="146" r="7" fill="#5ab0f0"/><circle class="commit k2" cx="1076" cy="146" r="7" fill="#5ab0f0"/>
<circle class="commit k3" cx="1116" cy="146" r="7" fill="#5ab0f0"/><circle class="commit k4" cx="1156" cy="146" r="7" fill="#5ab0f0"/>
<text x="1020" y="278" class="m">docs-site · <tspan class="t" style="font-size:13px">main</tspan></text>
<line x1="1020" y1="298" x2="1170" y2="298" stroke="#5ee0b0" stroke-width="3" stroke-linecap="round"/>
<circle class="commit k2" cx="1036" cy="298" r="7" fill="#5ee0b0"/><circle class="commit k4" cx="1076" cy="298" r="7" fill="#5ee0b0"/>
<circle class="commit" cx="1116" cy="298" r="7" fill="#5ee0b0"/>
<text x="1020" y="200" class="m">rebase · check ·</text><text x="1020" y="218" class="m">fast-forward,</text><text x="1020" y="236" class="m">verified only</text>
</svg>
