<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img"
     aria-label="Twenty session points shared by three hustles with weights two, one and one: ten, five and five. Docs needs only two, so its three spare points go to the other hustles: twelve, two and six are in use.">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .t{font-size:14px;font-weight:600;fill:#0f1115}
  .m{font-size:13px;fill:#8a94a6}
  .h{font-size:11px;font-weight:700;fill:#8a94a6;letter-spacing:.12em}
</style>
<rect width="900" height="250" rx="16" fill="#0f1115"/>
<rect x=".5" y=".5" width="899" height="249" rx="16" fill="none" stroke="#232833"/>

<text x="32" y="44" class="h">20 SESSION POINTS</text>
<g class="m">
  <rect x="220" y="32" width="12" height="12" rx="3" fill="#5ab0f0"/><text x="240" y="43" style="fill:#e6e6e6">Checkout v2 · 2 fr</text>
  <rect x="400" y="32" width="12" height="12" rx="3" fill="#4cc9d8"/><text x="420" y="43" style="fill:#e6e6e6">Docs · 1 fr</text>
  <rect x="540" y="32" width="12" height="12" rx="3" fill="#a78bfa"/><text x="560" y="43" style="fill:#e6e6e6">Offline sync · 1 fr</text>
</g>

<text x="32" y="98" class="h">SHARE</text>
<text x="32" y="116" class="m">by weight</text>
<rect x="160" y="80" width="349" height="40" rx="6" fill="#5ab0f0"/><text x="334" y="105" text-anchor="middle" class="t">10</text>
<rect x="513" y="80" width="171" height="40" rx="6" fill="#4cc9d8"/><text x="598" y="105" text-anchor="middle" class="t">5</text>
<rect x="688" y="80" width="172" height="40" rx="6" fill="#a78bfa"/><text x="774" y="105" text-anchor="middle" class="t">5</text>

<text x="32" y="168" class="h">IN USE</text>
<text x="32" y="186" class="m">work-conserving</text>
<rect x="160" y="150" width="419" height="40" rx="6" fill="#5ab0f0"/><text x="369" y="175" text-anchor="middle" class="t">12</text>
<rect x="583" y="150" width="66" height="40" rx="6" fill="#4cc9d8"/><text x="616" y="175" text-anchor="middle" class="t">2</text>
<rect x="653" y="150" width="207" height="40" rx="6" fill="#a78bfa"/><text x="756" y="175" text-anchor="middle" class="t">6</text>

<text x="160" y="222" class="m">Docs has work for only 2 points right now — its 3 spare points go to whoever is furthest below its share.</text>
</svg>
