<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hustlebot</title>
<link rel="stylesheet" href="/app.css">
</head><body><div class="wrap">
 <header class="top">
  <h1>hustlebot</h1>
  <a class="cinema-link" href="/cinema">Cinema view →</a>
 </header>

 <section id="approvals" hidden>
  <h2>Waiting for your approval</h2>
  <ul id="approvalList"></ul>
 </section>

 <section id="autoApproved" hidden>
  <h2>Approved automatically</h2>
  <ul id="autoApprovedList"></ul>
 </section>

 <h2>Hustles</h2>
 <div class="flow">
  <div class="core-col">
   <canvas id="flow" aria-hidden="true"></canvas>
   <div class="core" id="core">
    <div class="core-pct" id="corePct"></div>
    <div class="core-label">5h session</div>
    <div class="core-week" id="coreWeek"></div>
   </div>
   <div class="core-points">
    <div class="stepper"><button type="button" data-points="-1" aria-label="fewer points">−</button><span id="points"></span><button type="button" data-points="1" aria-label="more points">+</button></div>
    <div class="muted" id="pointsText"></div>
    <div class="muted" id="thresholdText"></div>
    <div class="settings">
     <label class="setting" title="whether plans may use Fable at all"><span class="switch"><input type="checkbox" id="allowFable"><span></span></span>Fable allowed</label>
     <div class="setting">auto-approve <span class="segmented" id="autoApprove" role="radiogroup" aria-label="auto-approve"></span></div>
     <div class="setting" id="growth" hidden>up to <span class="stepper"><button type="button" data-growth="-5" aria-label="less growth">−</button><span id="growthValue"></span><button type="button" data-growth="5" aria-label="more growth">+</button></span> growth, one model step</div>
    </div>
   </div>
  </div>
  <div id="hustles"></div>
 </div>
</div>

<div id="overlay" hidden>
 <div class="overlay-bar"><button type="button" id="overlayClose" class="back">← Hustles</button><span id="overlayTitle"></span></div>
 <iframe id="overlayFrame" title="Hustle graph"></iframe><!-- replaced per hustle by app.js -->
</div>

<template id="hustleCard">
 <article class="hustle">
  <label class="switch" title="active / inactive"><input type="checkbox" class="active"><span></span></label>
  <div class="weight" title="weight (share among active hustles)">
   <button type="button" data-weight="-1" aria-label="lower weight">−</button><span class="w"></span><button type="button" data-weight="1" aria-label="higher weight">+</button>
   <div class="share muted"></div>
  </div>
  <span class="status"></span>
  <span class="project"></span>
  <span class="title"></span>
  <div class="progress"><div class="bar ok"><i></i></div><div class="muted count"></div>
   <div class="push" hidden><span class="muted pushed"></span> <button type="button" class="pushNow">Push</button></div></div>
  <canvas class="load" width="300" height="64"></canvas>
  <div class="preview"><iframe tabindex="-1" title="graph preview" loading="lazy"></iframe></div>
 </article>
</template>
<script src="/load.js"></script>
<script src="/flow.js"></script>
<script src="/thresholds.js"></script>
<script src="/app.js"></script>
</body></html>
