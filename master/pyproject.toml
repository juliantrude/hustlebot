[project]
name = "hustlemaster"
version = "0.1.0"
description = "hustlebot v2: one background service per machine that runs several hustles in parallel"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pexpect>=4.9",
    "pyte>=0.8",
]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hustlemaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["views: renders the dashboard in the system Chromium (Playwright)"]
